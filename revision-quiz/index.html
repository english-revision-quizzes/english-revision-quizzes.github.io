<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>English revision quiz, Units 1 to 3</title>
<style>html, body, #root { margin: 0; min-height: 100%; }
body { background: #fffcf8; }
.quiz-root { position: relative; overflow: hidden; margin: -8px; padding: 12px 4px 28px; background: linear-gradient(180deg, #fff6d6 0%, #ffe9f1 45%, #e3f4ff 100%); border-radius: 20px; color: #2a2340; font-size: 16px; line-height: 1.45; }
.quiz-root * { box-sizing: border-box; }
.quiz-root h1 { font-family: inherit; font-size: 30px; line-height: 1.1; margin: 4px 0; font-weight: 800; letter-spacing: -0.02em; color: #3b2a8c; }
.quiz-root h2 { font-family: inherit; font-size: 20px; margin: 22px 0 10px; font-weight: 800; color: #3b2a8c; }
.quiz-hero, .quiz-results { text-align: center; padding: 28px 14px 8px; }
.quiz-hero-emoji { font-size: 56px; line-height: 1; }
.quiz-sub { font-size: 20px; font-weight: 700; color: #ff5a8a; margin: 0 0 14px; }
.quiz-info { list-style: none; margin: 0 auto 20px; padding: 0; max-width: 300px; display: grid; gap: 8px; }
.quiz-info li { background: #fff; border-radius: 14px; padding: 10px 14px; box-shadow: 0 2px 0 #ffd36b; font-weight: 600; }
.quiz-btn { font: inherit; font-weight: 800; font-size: 17px; min-height: 52px; padding: 0 26px; border-radius: 16px; border: 0; cursor: pointer; transition: transform .1s; }
.quiz-btn:active:not(:disabled) { transform: translateY(2px); }
.quiz-btn:disabled { opacity: .4; cursor: not-allowed; }
.quiz-btn-go { background: #ff5a8a; color: #fff; box-shadow: 0 4px 0 #c93768; }
.quiz-btn-ghost { background: #fff; color: #3b2a8c; box-shadow: 0 4px 0 #cfc6f5; }
.quiz-sound-row { margin: 14px 0; }
.quiz-sound { font: inherit; font-weight: 700; font-size: 14px; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 2px solid #cfc6f5; background: #fff; color: #3b2a8c; cursor: pointer; }
.quiz-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 6px; }
.quiz-count { font-weight: 800; color: #3b2a8c; }
.quiz-bar { height: 12px; background: #fff; border-radius: 8px; margin: 8px 6px 14px; overflow: hidden; box-shadow: inset 0 0 0 2px #e6dffb; }
.quiz-bar div { height: 100%; background: linear-gradient(90deg, #2ec4b6, #4d96ff, #b565f2); border-radius: 8px; transition: width .3s; }
.quiz-card { background: #fff; border-radius: 22px; padding: 16px 14px 14px; margin: 0 4px; box-shadow: 0 4px 0 #e6dffb; animation: quiz-pop .25s ease-out; }
@keyframes quiz-pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.quiz-chips, .quiz-rev-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.quiz-num { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 34px; padding: 0 8px; border-radius: 17px; background: #4d96ff; color: #fff; font-weight: 800; }
.quiz-chip { background: #ede7ff; color: #3b2a8c; font-weight: 700; font-size: 13px; padding: 5px 10px; border-radius: 12px; }
.quiz-stem { font-size: 18px; font-weight: 600; margin-bottom: 14px; }
.quiz-stem p { margin: 0 0 6px; }
.quiz-stem p.quiz-stem-quote { font-size: 21px; font-weight: 800; color: #3b2a8c; background: #fff6d6; padding: 10px 12px; border-radius: 12px; }
.quiz-opts { display: grid; gap: 10px; }
.quiz-opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: start; font: inherit; font-weight: 600; font-size: 17px; min-height: 56px; padding: 8px 12px; background: #f7f5ff; color: #2a2340; border: 3px solid #e1dafa; border-radius: 16px; cursor: pointer; }
.quiz-opt:active:not(:disabled) { transform: scale(.99); }
.quiz-letter { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: #fff; border: 2px solid #b9aaf0; color: #3b2a8c; font-weight: 800; text-transform: uppercase; }
.quiz-opt-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.quiz-mark { font-size: 22px; font-weight: 800; }
.quiz-opt.is-right { background: #d9f7e4; border-color: #2fb866; }
.quiz-opt.is-right .quiz-mark { color: #1c8c4a; }
.quiz-opt.is-wrong { background: #ffe3e3; border-color: #ff6b6b; }
.quiz-opt.is-wrong .quiz-mark { color: #d62f2f; }
.quiz-opt.is-dim { opacity: .5; }
.quiz-opt:disabled { cursor: default; }
.quiz-feedback { margin-top: 12px; min-height: 26px; font-weight: 700; color: #5b4fa0; text-align: center; }
.quiz-nav { display: flex; justify-content: space-between; gap: 12px; margin: 16px 4px 0; }
.quiz-nav .quiz-btn { flex: 1; }
.quiz-hint { text-align: center; font-size: 14px; color: #5b4fa0; margin: 10px 8px 0; }
.quiz-score { display: inline-flex; align-items: baseline; gap: 6px; background: #fff; border-radius: 28px; padding: 10px 30px; margin: 10px 0; box-shadow: 0 5px 0 #ffd36b; }
.quiz-score span { font-size: 76px; font-weight: 900; line-height: 1; color: #ff5a8a; }
.quiz-score small { font-size: 28px; font-weight: 800; color: #3b2a8c; }
.quiz-verdict { font-size: 20px; font-weight: 800; margin: 6px 0 12px; }
.quiz-tally { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.quiz-tally span { font-weight: 800; padding: 8px 14px; border-radius: 14px; }
.quiz-tally-ok { background: #d9f7e4; color: #1c7a43; }
.quiz-tally-bad { background: #ffe3e3; color: #b72a2a; }
.quiz-review { padding: 0 8px; }
.quiz-rev { background: #fff; border-radius: 18px; padding: 14px; margin-bottom: 12px; box-shadow: 0 3px 0 #e6dffb; }
.quiz-rev .quiz-stem { font-size: 16px; margin-bottom: 10px; }
.quiz-ans { display: grid; gap: 2px; padding: 8px 12px; border-radius: 12px; margin-top: 6px; }
.quiz-ans span { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
.quiz-ans b { font-size: 17px; overflow-wrap: anywhere; }
.quiz-ans-bad { background: #ffe3e3; color: #a42525; }
.quiz-ans-ok { background: #d9f7e4; color: #176a3a; }
.quiz-allright { margin: 20px 8px 0; background: #d9f7e4; color: #176a3a; font-weight: 800; padding: 14px; border-radius: 16px; text-align: center; }
.quiz-key { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; }
.quiz-key div { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 8px 10px; border-radius: 12px; background: #fff; font-weight: 700; }
.quiz-key b { text-transform: uppercase; color: #3b2a8c; }
.quiz-key-ok i { color: #1c8c4a; font-style: normal; font-weight: 800; }
.quiz-key-bad i { color: #d62f2f; font-style: normal; font-weight: 800; }
.quiz-confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
.quiz-piece { position: absolute; top: -20px; opacity: 0; animation-name: quiz-fall; animation-timing-function: linear; animation-iteration-count: 4; }
@keyframes quiz-fall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(900px) rotate(720deg); opacity: 1; } }
@media (min-width: 768px) { .quiz-root { max-width: 640px; margin: 0 auto; } }
@media (prefers-reduced-motion: reduce) { .quiz-piece { animation-iteration-count: 1; } .quiz-card { animation: none; } }

.sa-wrap{max-width:560px;margin:0 auto;padding:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans',Arial,sans-serif}
